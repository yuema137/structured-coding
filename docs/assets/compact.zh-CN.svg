<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title"><title id="title">compact 或 resume 时，怎么接着干？</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="240" rx="12" fill="#f0f2eb"/><text x="20" y="64" font-size="13" font-weight="550" fill="#285c4e">手动 COMPACT</text><rect x="205" y="16" width="205" height="94" rx="8" fill="#ffffff"/><text x="220" y="58" font-size="15" font-weight="400" fill="#20332e">检查 handoff</text><text x="415" y="65" font-size="17" font-weight="400" fill="#5a6a63">→</text><rect x="435" y="16" width="205" height="94" rx="8" fill="#ffffff"/><text x="450" y="58" font-size="15" font-weight="400" fill="#20332e">过时？先同步</text><text x="645" y="65" font-size="17" font-weight="400" fill="#5a6a63">→</text><rect x="665" y="16" width="205" height="94" rx="8" fill="#ffffff"/><text x="680" y="58" font-size="15" font-weight="400" fill="#20332e">再 compact</text><text x="20" y="176" font-size="13" font-weight="550" fill="#285c4e">自动 COMPACT</text><rect x="205" y="128" width="205" height="94" rx="8" fill="#ffffff"/><text x="220" y="170" font-size="15" font-weight="400" fill="#20332e">保存 snapshot / 警告</text><text x="415" y="177" font-size="17" font-weight="400" fill="#5a6a63">→</text><rect x="435" y="128" width="205" height="94" rx="8" fill="#ffffff"/><text x="450" y="170" font-size="15" font-weight="400" fill="#20332e">允许 compact</text><text x="645" y="177" font-size="17" font-weight="400" fill="#5a6a63">→</text><rect x="665" y="128" width="205" height="94" rx="8" fill="#ffffff"/><text x="680" y="170" font-size="15" font-weight="400" fill="#20332e">恢复真实状态</text></g></svg>
