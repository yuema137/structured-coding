<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title"><title id="title">一次一个 PR，把整个过程接成闭环。</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="600" rx="18" fill="#f0f2eb"/><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#91a599"/></marker></defs><path d="M290 189H320" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585 189H615" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M750 276V333" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620 425H585" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325 425H290" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M40 425H20V84H455V103" fill="none" stroke="#91a599" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="40" y="49" font-size="12" font-weight="400" fill="#5a6a63">WORKFLOW</text><rect x="40" y="112" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="60" y="141" font-size="11" font-weight="400" fill="#5a6a63">01   人 + AGENT</text><text x="60" y="177" font-size="19" font-weight="550" fill="#20332e">商量整体方向</text><text x="60" y="228" font-size="12" font-weight="400" fill="#5a6a63">需求 → overall → step</text><rect x="335" y="112" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="355" y="141" font-size="11" font-weight="400" fill="#5a6a63">02   AGENT</text><text x="355" y="177" font-size="19" font-weight="550" fill="#20332e">设计下一个 PR</text><text x="355" y="228" font-size="12" font-weight="400" fill="#5a6a63">审查 code、规划 commit、确定验收</text><rect x="630" y="112" width="240" height="154" rx="12" fill="#f2ede1" stroke="#d7ded3"/><text x="650" y="141" font-size="11" font-weight="400" fill="#5a6a63">03   人</text><text x="650" y="177" font-size="19" font-weight="550" fill="#20332e">批准执行边界</text><text x="650" y="228" font-size="12" font-weight="400" fill="#5a6a63">冻结 design，填好 contract</text><rect x="630" y="348" width="240" height="154" rx="12" fill="#285c4e" stroke="#d7ded3"/><text x="650" y="377" font-size="11" font-weight="400" fill="#d0e4d6">04   AGENT</text><text x="650" y="413" font-size="19" font-weight="550" fill="#ffffff">自主执行</text><text x="650" y="464" font-size="12" font-weight="400" fill="#d0e4d6">新 session · coding · 验证 ·</text><text x="650" y="480.2" font-size="12" font-weight="400" fill="#d0e4d6">commit</text><rect x="335" y="348" width="240" height="154" rx="12" fill="#f2ede1" stroke="#d7ded3"/><text x="355" y="377" font-size="11" font-weight="400" fill="#5a6a63">05   人</text><text x="355" y="413" font-size="19" font-weight="550" fill="#20332e">review，再授权 merge</text><text x="355" y="464" font-size="12" font-weight="400" fill="#5a6a63">最终 HEAD 的必需 CI 通过</text><rect x="40" y="348" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="60" y="377" font-size="11" font-weight="400" fill="#5a6a63">06   AGENT</text><text x="60" y="413" font-size="19" font-weight="550" fill="#20332e">把结果写回计划</text><text x="60" y="464" font-size="12" font-weight="400" fill="#5a6a63">merge 后：PR → step → overall</text><text x="450" y="310" text-anchor="middle" font-size="13" fill="#285c4e">普通 bug：修好继续。实质性改动：回来商量。</text><text x="450" y="560" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a6a63">用 MERGE 后的事实，规划下一个 PR</text></g></svg>
