<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title"><title id="title">Where you step in.</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="190" rx="12" fill="#f7f7f2"/><rect x="10" y="12" width="270" height="165" rx="10" fill="#f2ede1"/><text x="30" y="44" font-size="11" font-weight="400" fill="#5a6a63">01</text><text x="30" y="82" font-size="21" font-weight="550" fill="#20332e">Set the goal</text><text x="30" y="121" font-size="14" font-weight="400" fill="#5a6a63">You explain the goal and</text><text x="30" y="139.9" font-size="14" font-weight="400" fill="#5a6a63">limits.</text><text x="290" y="101" font-size="20" font-weight="400" fill="#5a6a63">→</text><rect x="315" y="12" width="270" height="165" rx="10" fill="#f2ede1"/><text x="335" y="44" font-size="11" font-weight="400" fill="#5a6a63">02</text><text x="335" y="82" font-size="21" font-weight="550" fill="#20332e">Approve the design</text><text x="335" y="121" font-size="14" font-weight="400" fill="#5a6a63">You approve this PR&#x27;s</text><text x="335" y="139.9" font-size="14" font-weight="400" fill="#5a6a63">boundaries.</text><text x="595" y="101" font-size="20" font-weight="400" fill="#5a6a63">→</text><rect x="620" y="12" width="270" height="165" rx="10" fill="#f2ede1"/><text x="640" y="44" font-size="11" font-weight="400" fill="#5a6a63">03</text><text x="640" y="82" font-size="21" font-weight="550" fill="#20332e">Review the result</text><text x="640" y="121" font-size="14" font-weight="400" fill="#5a6a63">You review evidence before</text><text x="640" y="139.9" font-size="14" font-weight="400" fill="#5a6a63">merge.</text></g></svg>
